[package]
name = "wedo"
version = "0.1.0"
edition = "2021"
description = "Controller for the LEGO WeDo 1.0 USB hub (9581 / 45303)"

[dependencies]
hidapi = { version = "2.4", features = ["windows-native"] }
# OpenGL (glow) instead of wgpu: runs on old laptops without DX12/Vulkan.
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }

[profile.release]
strip = true
